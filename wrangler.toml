# Renamed in the Cloudflare dashboard on 2026-09-14. This line has to match the
# dashboard: `wrangler deploy` targets a Worker by name, so a stale name here
# does not fail — it creates a second, empty Worker carrying the cron and the D1
# binding. The rename's first CI run did exactly that.
name = "sun-dogs-scout"
main = "src/index.ts"
compatibility_date = "2026-06-21"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "dougmcarthur-music-hq"
database_id = "515d234f-92c3-4519-abc3-3d453a1b5058"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"

# NOTE: compatibility_date is a best-effort guess (matches Worker's created_on).
# Verify against the real deployed Worker settings before relying on it.

# The weekly digest ticks hourly; it does not send hourly.
#
# The day, hour and time zone live in `app_settings` so they can be changed
# from the Settings screen without a deploy, and `isDigestDue` decides whether
# a given tick is the one. That also fixes what this cron could not: cron is
# UTC year-round, so a fixed hour drifted against Winnipeg every time the
# clocks changed. The zone is applied when the comparison is made instead.
[triggers]
crons = ["0 * * * *"]

# Cloudflare Email Service, sending from sundogsmusic.ca (onboarded 2026-09-14).
#
# There is no destination allowlist any more. It held one address, the
# owner's, and was the boundary while this was one person's app; invitations
# and per-artist recovery need mail to reach other people. The boundary is now
# `sendMail` in src/lib/mailer.ts, which refuses any address that is not on an
# account or a live invitation (shared/recipients.ts) — weaker in that a bug
# there could widen it, which is why it is one function called from one place
# and pinned by test/recipients.test.ts.
#
# The *sender* is still enforced here: these are the only From addresses the
# binding will accept, whatever the code or the digest settings say.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [
  "login@sundogsmusic.ca",
  "digest@sundogsmusic.ca",
]

[vars]
# Two jobs since passkey login replaced Cloudflare Access: it is the link base
# in the digest email, and it is the WebAuthn relying party. The second makes
# it load-bearing — the hostname is baked into every credential at
# registration and checked on every assertion, so changing it invalidates
# every passkey already enrolled. See docs/passkey-login.md.
DASHBOARD_URL = "https://scout.sundogsmusic.ca"

# The owner's recovery address: where a setup code goes when the owner's
# address is the one typed on the sign-in screen. Invited artists recover to
# the address their invitation was issued to.
AUTH_EMAIL = "doug@dougmcarthur.net"
AUTH_EMAIL_SENDER = "login@sundogsmusic.ca"

# Every email's footer identifies the sender: the house mark, this address and
# the site. test/emailTemplate.test.ts fails while it is unset — an email that
# cannot say who sent it is not one to ship. See src/lib/emailTemplate.ts.
MAIL_POSTAL_ADDRESS = "55 Tunis Bay, Winnipeg, MB R3T 2X2"
# Where a reply lands. login@ and digest@ have no mailbox behind them, so
# unset means a reply bounces rather than reaching anybody.
# MAIL_REPLY_TO = ""

# Google Picker, for adding files to an artist's EPK folder in their Drive.
# Both are public by nature — the picker runs in the page — so they are vars.
# Unset, the Drive tab connects and lists the folder but offers no picker, and
# says so. Setup, all in the same Google Cloud project as GOOGLE_CLIENT_ID:
#   1. APIs & Services → enable "Google Drive API" and "Google Picker API".
#   2. OAuth consent screen → add the scope .../auth/drive.file (non-sensitive,
#      no verification needed).
#   3. Credentials → Create API key; restrict it to the Picker API and to the
#      website https://scout.sundogsmusic.ca/*.
#   4. The project NUMBER (not the id) is on the project's dashboard.
# GOOGLE_PICKER_API_KEY = ""
# GOOGLE_CLOUD_PROJECT_NUMBER = ""

# API_TOKEN is a secret, not a var: `wrangler secret put API_TOKEN`. It is the
# research agents' credential, and it is the thing to set BEFORE switching
# Cloudflare Access off — headless callers cannot do a passkey ceremony, so
# without it every agent POST becomes a 401 the moment Access stops letting
# them through.

# The artist survey (docs/artist-survey-questionnaire.md). Shipped CLOSED.
#
# It opens only when SURVEY_OPEN is exactly "true" AND SURVEY_CONTACT_EMAIL is
# set, because the notice every respondent reads promises a contact address and
# a public survey that cannot say who to ask is not one to open. Turn it off by
# setting SURVEY_OPEN back to "false": nobody new can start, and people already
# partway through can still finish.
#
# Before sharing the link:
#   1. Set SURVEY_CONTACT_EMAIL (a real mailbox somebody reads).
#   2. Turnstile, so a bot cannot fill it: create a widget in the Cloudflare
#      dashboard (Turnstile → Add site, the site's hostname), put the SITE key
#      here as TURNSTILE_SITE_KEY, and the SECRET with
#      `wrangler secret put TURNSTILE_SECRET_KEY`. Without both it still runs,
#      and the owner's survey panel says no spam check is configured.
#   3. Have two or three artists read it aloud first (the doc's section 7).
#   4. Optionally SURVEY_RESULTS_URL, where a summary will be posted. The notice
#      promises a summary; with no address it says so without a link.
SURVEY_OPEN = "false"
# SURVEY_CONTACT_EMAIL = ""
# SURVEY_RESULTS_URL = ""
# TURNSTILE_SITE_KEY = ""
