<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1dc" />
    <script>
      /* Sets the theme before the first paint, so a dark page does not open
         light for a frame and a light page does not open dark. The same
         decision applyAppearance makes later, kept to what it needs: the
         default is test-pinned to appearance.ts. */
      try {
        var a = JSON.parse(localStorage.getItem('musichq.appearance') || '{}')
        var t = a.theme || 'light'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var root = document.documentElement
        root.dataset.theme = t
        var more = matchMedia('(prefers-contrast: more)').matches
        var hc = a.highContrast
        if (hc === undefined || hc === null) hc = more
        root.dataset.contrast = hc ? 'high' : 'normal'
        var p = a.palette
        if (!p) p = more ? 'high-contrast' : 'sun-dogs'
        root.dataset.palette = p
      } catch (e) {}
    </script>
    <title>Sun Dogs Music Scout</title>
    <meta
      name="description"
      content="Sun Dogs Music Scout finds festivals, showcases, grants and sync calls for independent Canadian musicians, helps you decide which are worth it, and drafts the paperwork."
    />
    <link rel="canonical" href="https://scout.sundogsmusic.ca/" />

    <!-- The preview a shared link unfolds into. The image is frontend/public/og-image.png
         (source: scripts/og/og-image.html) and has to be an absolute address, because
         a crawler reads this page without knowing where it came from. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sun Dogs Music Scout" />
    <meta property="og:title" content="Sun Dogs Music Scout" />
    <meta
      property="og:description"
      content="Finds festivals, showcases, grants and sync calls for independent Canadian musicians, helps you decide which are worth it, and drafts the paperwork."
    />
    <meta property="og:url" content="https://scout.sundogsmusic.ca/" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:image" content="https://scout.sundogsmusic.ca/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The silhouette of a dog in profile in dark plum on orange, beside the words Sun Dogs Music Scout."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sun Dogs Music Scout" />
    <meta
      name="twitter:description"
      content="Finds festivals, showcases, grants and sync calls for independent Canadian musicians, helps you decide which are worth it, and drafts the paperwork."
    />
    <meta name="twitter:image" content="https://scout.sundogsmusic.ca/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The silhouette of a dog in profile in dark plum on orange, beside the words Sun Dogs Music Scout."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
