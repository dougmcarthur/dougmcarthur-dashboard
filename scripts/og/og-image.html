  (not a dependency of this repository) and `npm ci` for the self-hosted fonts.
  Edit this file and re-render; the PNG is committed because a link preview is
  fetched from the deployed site, not built there.

  The dog is the logo's own path, unmodified, at the left edge so its body
  bleeds off the card as it does in the square mark. Everything that matters

-->
