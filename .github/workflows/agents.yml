name: Agents

# The three research agents, run by hand through the Claude API.
#
# This file used to hold their schedules. It is now the paid fallback: the
# schedules moved to Claude Code routines, which run on the artist's Claude
# plan instead of API credit. Here a sweep costs several dollars in tokens, and
# a pet project with no paying users does not carry that three times a week.
# See docs/agent-routines.md.
#
# What stays is a runner that works without a routine: the same prompts
# (scripts/agents/prompts/), the same named tools (scripts/agents/tools.ts), and
# a heartbeat the script posts itself. Trigger it from the Actions tab when a
# routine is down and a sweep cannot wait.
#
# The app watches either way: `shared/taskCadence.ts` measures each task's
# cadence from its own run history and raises a critical notification when one
# goes quiet for longer than its own habit.

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Which agent to run
        required: true
        type: choice
        options: [gig-festival-scan, sync-pitch-research, monthly-promo-checkin]
      apply:
        description: Write to the database (off = dry run, logs what it would do)
        type: boolean
        default: false

# One agent at a time. They read and write the same tables, and two runs
# racing is how you get a duplicate row that both of them checked for and
# neither of them saw.
concurrency:
  group: agents
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gig-festival-scan:
    if: inputs.agent == 'gig-festival-scan'
    uses: ./.github/workflows/agent-run.yml
    with:
      agent: gig-festival-scan
      apply: ${{ inputs.apply == true }}
    secrets: inherit

  sync-pitch-research:
    if: inputs.agent == 'sync-pitch-research'
    uses: ./.github/workflows/agent-run.yml
    with:
      agent: sync-pitch-research
      apply: ${{ inputs.apply == true }}
    secrets: inherit

  monthly-promo-checkin:
    if: inputs.agent == 'monthly-promo-checkin'
    uses: ./.github/workflows/agent-run.yml
    with:
      agent: monthly-promo-checkin
      apply: ${{ inputs.apply == true }}
    secrets: inherit
